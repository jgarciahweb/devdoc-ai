<div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl h-full flex flex-col justify-between min-h-[500px]">

  <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-4">
    <h2 class="text-xl font-bold text-white flex items-center gap-2">
      <span>📄</span> Documentación Generada
    </h2>

    @if (markdownData() && !isLoading()) {
      <button
        (click)="copyToClipboard()"
        class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium py-1.5 px-3 rounded-lg border border-slate-700 transition-all flex items-center gap-1.5 cursor-pointer active:scale-95">
        <span>📋</span> Copiar Markdown
      </button>
    }
  </div>

  <div class="flex-grow overflow-y-auto max-h-[550px] pr-2 custom-scrollbar">

    @if (isLoading()) {
      <div class="h-full flex flex-col items-center justify-center py-20 text-slate-400 gap-3">
        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm font-medium animate-pulse">Gemini AI está analizando tu código...</p>
      </div>
    } @else if (!markdownData()) {
      <div class="h-full flex flex-col items-center justify-center py-20 text-slate-500 text-center">
        <span class="text-4xl mb-2">✨</span>
        <p class="text-sm">Introduce tu código a la izquierda y pulsa el botón para ver la magia de la IA.</p>
      </div>
    } @else {
      <div class="prose prose-invert prose-slate prose-headings:text-indigo-400 prose-code:text-emerald-400 max-w-none">
        <markdown [data]="markdownData()"></markdown>
      </div>
    }

  </div>
</div>
