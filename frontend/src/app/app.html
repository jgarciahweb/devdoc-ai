<div class="min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col justify-between">

  <header class="border-b border-slate-900 bg-slate-900/50 backdrop-blur-md px-6 py-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🤖</span>
        <div>
          <h1 class="text-xl font-black bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">
            DevDoc AI
          </h1>
          <p class="text-xs text-slate-500">Documentador automático de código para tu Portfolio</p>
        </div>
      </div>
      <span class="text-xs bg-slate-800 text-indigo-400 border border-slate-700 font-mono px-2 py-1 rounded-md">
        v1.0.0 (Angular 22)
      </span>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8 flex-grow grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">

    <app-editor (onSubmit)="processCode($event)"></app-editor>

    <app-preview
      [markdownData]="generatedMarkdown()"
      [isLoading]="loading()"
      (onCopy)="handleCopyNotification()">
    </app-preview>

  </main>

  <footer class="text-center py-4 text-xs text-slate-600 border-t border-slate-900">
    Desarrollado con el MEAN Stack, TailwindCSS & Gemini API.
  </footer>

</div>
