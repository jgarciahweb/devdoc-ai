<div class="min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col justify-between">

  <header class="border-b border-slate-900 bg-slate-900/50 backdrop-blur-md px-8 py-4 sticky top-0 z-50">
    <div class="w-full mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🤖</span>
        <div>
          <h1 class="text-xl font-black bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">
            DevDoc AI
          </h1>
          <p class="text-xs text-slate-500">Documentador automático de código</p>
        </div>
      </div>
    </div>
  </header>

  <main class="w-full mx-auto px-6 md:px-8 py-6 flex flex-col md:flex-row items-stretch gap-6 flex-grow">

    <div class="w-full md:w-64 lg:w-72 flex flex-col shrink-0">
      <app-history-sidebar
        [documents]="historyList()"
        (onSelectDocument)="loadDocumentFromHistory($event)"
        class="h-full flex flex-col">
      </app-history-sidebar>
    </div>

    <div class="flex-grow grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">
      <app-editor (onSubmit)="processCode($event)"></app-editor>
      <app-preview
        [markdownData]="generatedMarkdown()"
        [isLoading]="loading()"
        (onCopy)="handleCopyNotification()">
      </app-preview>
    </div>

  </main>

  <footer class="text-center py-4 text-xs text-slate-600 border-t border-slate-900">
    Desarrollado con el MEAN Stack, TailwindCSS & Gemini API.
  </footer>

</div>
