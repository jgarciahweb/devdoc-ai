name: Playwright Tests (CI)

# El workflow se ejecuta en cada push o pull request a la rama main (o master)
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar el repositorio
      uses: actions/checkout@v4

    - name: 🟢 Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22 
        cache: 'npm'

    - name: 📦 Instalar dependencias globales del monorrepo
      run: npm install

    - name: 🎭 Instalar navegadores de Playwright
      run: npx playwright install --with-deps chromium

    - name: 🚀 Levantar la app de Angular en segundo plano
      # Arrancamos el frontend. El flag --skip-nx-cache (si usas nx) o simplemente ng serve.
      # Usamos 'nohup' o '&' para que corra en segundo plano y permita continuar al siguiente paso.
      run: |
        npm run start:frontend &
        npx wait-on http://localhost:4200 --timeout 60000

    - name: 🧪 Ejecutar los Tests End-to-End
      # Ejecutamos el archivo específico que acabamos de dejar impecable
      run: npx playwright test frontend/tests/devdoc.spec.ts

    # Opcional: Si el test falla, GitHub guarda un reporte visual para que veas la captura de pantalla del error
    - name: 📊 Guardar reporte si hay fallos
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && failure() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7